plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

// Release credentials live in the user's ~/.gradle/gradle.properties, never in Git.
def releaseStoreFile = providers.gradleProperty('sds011ReleaseStoreFile').orNull
def releaseStorePassword = providers.gradleProperty('sds011ReleaseStorePassword').orNull
def releaseKeyAlias = providers.gradleProperty('sds011ReleaseKeyAlias').orNull
def releaseKeyPassword = providers.gradleProperty('sds011ReleaseKeyPassword').orNull
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException('Release signing is not configured. Add sds011Release* values to ~/.gradle/gradle.properties.')
}

android {
    namespace 'de.demogorgi.sds011native'
    compileSdk 35

    defaultConfig {
        applicationId 'de.demogorgi.sds011native'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
